name: Iron Dominion CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore IronDominion.sln
      - name: Build
        run: dotnet build IronDominion.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test IronDominion.sln --configuration Release --no-build
