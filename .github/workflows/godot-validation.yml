name: Godot Validation
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Godot .NET editor
        run: |
          godot_bin=$(scripts/install-godot-linux.sh "$RUNNER_TEMP/godot")
          printf 'GODOT_BIN=%s\n' "$godot_bin" >> "$GITHUB_ENV"
      - name: Import and launch the project headlessly
        run: scripts/validate-godot.sh
